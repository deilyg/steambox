<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SteamBox — Live TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest">
function showHome(){
  const home=document.querySelector('#home, .home-section, [data-page="home"]');
  const browse=document.querySelector('#browse, .channels-section, [data-page="browse"]');
  if(home) home.style.display='';
  if(browse) browse.scrollIntoView({behavior:'smooth'});
  window.scrollTo({top:0,behavior:'smooth'});
}
</script>
<style>
:root{--bg:#07080a;--panel:#111318;--panel2:#181b22;--text:#f5f7fa;--muted:#9da5b1;--accent:#e50914;--line:#292e37}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:rgba(7,8,10,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.nav{height:68px;display:flex;align-items:center;gap:26px;padding:0 4vw}.brand{font-weight:900;font-size:25px;letter-spacing:-1px}.brand span{color:var(--accent)}.navlinks{display:flex;gap:20px}.navlinks button,.cat button{background:none;border:0;color:#c8ccd3}.navlinks button:hover,.navlinks .active{color:#fff}.search{margin-left:auto;background:#15181e;border:1px solid #303641;border-radius:10px;color:#fff;padding:10px 13px;width:min(280px,35vw);outline:none}.wrap{padding:0 4vw 50px}.hero{min-height:430px;display:flex;align-items:end;padding:60px 0 42px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,#4a1016 0,#111 32%,transparent 70%);opacity:.75;pointer-events:none}.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(42px,7vw,82px);margin:0 0 12px;line-height:.95}.hero p{max-width:650px;color:var(--muted);font-size:17px}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:9px;padding:12px 18px;font-weight:800}.primary{background:#fff;color:#050505}.secondary{background:#252932;color:#fff}.section{margin-top:30px}.sectionhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.section h2{font-size:21px;margin:0}.count{color:var(--muted);font-size:13px}.rail{display:flex;gap:13px;overflow:auto;padding-bottom:8px;scroll-behavior:smooth}.card{min-width:190px;max-width:230px;background:var(--panel);border:1px solid var(--line);border-radius:13px;overflow:hidden;transition:.2s;flex:1}.card:hover{transform:translateY(-3px);border-color:#555}.thumb{height:112px;background:linear-gradient(135deg,#20242d,#101216);display:grid;place-items:center;font-size:29px;font-weight:900}.cardbody{padding:12px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:4px}.cat{display:flex;gap:8px;overflow:auto}.cat button{white-space:nowrap;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#111318}.cat button.active{background:#fff;color:#000;border-color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:13px}.grid .card{min-width:0}.page{display:none}.page.active{display:block}.empty{color:var(--muted);padding:50px;text-align:center}.status{font-size:12px;color:var(--muted)}
#player{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:100;display:none;overflow:auto}.playerin{min-height:100%;display:grid;grid-template-columns:1fr 330px;gap:18px;padding:22px}.videoarea{display:flex;flex-direction:column;min-width:0}.video{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}.video video{width:100%;height:100%;object-fit:contain}.bar{display:flex;align-items:center;gap:9px;padding:12px 0;flex-wrap:wrap}.bar button{background:#1c2028;border:1px solid #303641;color:#fff;border-radius:8px;padding:9px 12px}.bar input{accent-color:var(--accent)}.now{font-size:20px;font-weight:900;margin-top:5px}.side{background:#0f1217;border:1px solid #292e37;border-radius:12px;padding:15px;overflow:auto}.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sideitem{padding:12px;border-radius:9px;margin-bottom:6px;background:#171a20;border:1px solid transparent;cursor:pointer}.sideitem.active{border-color:var(--accent);background:#211114}.close{position:fixed;right:20px;top:15px;z-index:110;border:0;background:#fff;color:#000;border-radius:50%;width:38px;height:38px;font-size:20px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#181b22;border:1px solid #343a45;padding:10px 14px;border-radius:9px;display:none;z-index:200}.load{padding:40px;text-align:center;color:var(--muted)}
@media(max-width:800px){.nav{gap:12px}.navlinks{display:none}.search{width:45vw}.hero{min-height:350px}.playerin{grid-template-columns:1fr;padding:10px}.side{max-height:330px}.card{min-width:165px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

.back-home{display:inline-flex;align-items:center;gap:8px;margin:0 0 18px;padding:10px 16px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:#171717;color:#fff;font-weight:700;cursor:pointer}.back-home:hover{background:#242424}
</style>
</head>
<body>
<header class="top"><div class="nav"><div class="brand">Steam<span>Box</span></div><div class="navlinks"><button class="active" onclick="showPage('home',this)">Home</button><button onclick="showPage('channels',this)">Live TV</button></div><input id="search" class="search" placeholder="Search channel…" autocomplete="off"></div></header>
<main class="wrap">
<section id="home" class="page active">
<div class="hero"><div><div class="status" id="heroStatus">Connecting to live playlist…</div><h1>Live TV.<br>Right now.</h1><p>Browse available live channels and start watching directly from SteamBox.</p><div class="actions"><button class="primary" onclick="playFeatured()">▶ Play Now</button><button class="secondary" onclick="showPage('channels')">Browse Channels</button></div></div></div>
<div class="section"><div class="sectionhead"><h2>For You</h2><span class="count" id="forCount"></span></div><div class="rail" id="featured"></div></div>
<div class="section"><div class="sectionhead"><h2>Live Channels</h2><span class="count" id="liveCount">Loading…</span></div><div class="rail" id="liveRail"></div></div>
<div class="section"><div class="sectionhead"><h2>Browse by Category</h2></div><div class="cat" id="cats"></div></div>
<div class="section"><div class="sectionhead"><h2>News</h2></div><div class="rail" id="news"></div></div>
<div class="section"><div class="sectionhead"><h2>Sports</h2></div><div class="rail" id="sports"></div></div>
</section>
<section id="channels" class="page"><div style="padding-top:28px"><button class="back-home" onclick="showPage('home')">← Back to Home</button></div><div class="section" style="margin-top:28px"><div class="sectionhead"><h2>All Live Channels</h2><span class="count" id="allCount"></span></div><div class="cat" id="filterCats"></div><div class="grid" id="grid"></div></div></section>
</main>
<div id="player"><button class="close" onclick="closePlayer()">×</button><div class="playerin"><div class="videoarea"><div class="video"><video id="video" controls playsinline></video></div><div class="now" id="now"></div><div class="bar"><button onclick="prevChannel()">◀ Prev</button><button onclick="nextChannel()">Next ▶</button><button onclick="toggleMute()" id="muteBtn">🔊</button><input id="volume" type="range" min="0" max="1" step=".01" value="1"><span class="status" id="playStatus"></span></div></div><aside class="side"><div class="sidehead"><strong>Channels</strong><span class="count" id="sideCount"></span></div><div id="sideList"></div></aside></div></div><div id="toast" class="toast"></div>
<script>
const M3U_URL='https://iptv-org.github.io/iptv/countries/ph.m3u';
let channels=[],current=-1,hls=null,filter='All',searchTerm='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function parseM3U(txt){const lines=txt.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let out=[];for(let i=0;i<lines.length;i++){if(lines[i].startsWith('#EXTINF')){const name=lines[i].split(',').slice(1).join(',').trim();const url=lines[i+1]&&!lines[i+1].startsWith('#')?lines[i+1]:'';if(url)out.push({name,url,category:category(name)});}}return out}
function category(n){const s=n.toLowerCase();if(/sport|bein/.test(s))return'Sports';if(/news|cnn|bloomberg|finance/.test(s))return'News';if(/ewtn|3abn/.test(s))return'Religious';if(/movie|thriller|blues tv|tfc|japanim|persiana|outdoor/.test(s))return'Movies';return'Drama'}
function card(c,i){return `<article class="card" onclick="openPlayer(${i})"><div class="thumb">${icon(c.category)}</div><div class="cardbody"><div class="title">${esc(c.name)}</div><div class="meta">LIVE • ${esc(c.category)}</div></div></article>`}
function icon(cat){return cat==='Sports'?'🏆':cat==='News'?'📰':cat==='Religious'?'✝️':cat==='Movies'?'🎬':'📺'}
function render(){const shown=filtered();$('liveCount').textContent=channels.length+' live channels';$('allCount').textContent=channels.length+' channels';$('sideCount').textContent=channels.length; $('forCount').textContent='Updated from live M3U';$('featured').innerHTML=channels.slice(0,8).map((c,i)=>card(c,i)).join('')||empty();$('liveRail').innerHTML=channels.map((c,i)=>card(c,i)).join('')||empty();$('news').innerHTML=channels.filter(c=>c.category==='News').map(c=>card(c,channels.indexOf(c))).join('')||empty();$('sports').innerHTML=channels.filter(c=>c.category==='Sports').map(c=>card(c,channels.indexOf(c))).join('')||empty();renderCats();$('grid').innerHTML=shown.map((c)=>card(c,channels.indexOf(c))).join('')||empty();$('sideList').innerHTML=channels.map((c,i)=>`<div class="sideitem ${i===current?'active':''}" onclick="openPlayer(${i})">${esc(c.name)}<div class="meta">LIVE • ${c.category}</div></div>`).join('')||empty()}
function renderCats(){const cats=['All','Sports','Drama','News','Religious','Movies'];const html=cats.map(c=>`<button class="${filter===c?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');$('cats').innerHTML=html;$('filterCats').innerHTML=html}
function filtered(){return channels.filter(c=>(filter==='All'||c.category===filter)&&c.name.toLowerCase().includes(searchTerm.toLowerCase()))}
function setFilter(f){filter=f;showPage('channels');render()}
function empty(){return '<div class="empty">No channels found.</div>'}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.navlinks button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');window.scrollTo(0,0)}
async function loadPlaylist(){try{$('heroStatus').textContent='Loading live playlist…';const r=await fetch(M3U_URL,{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const text=await r.text();channels=parseM3U(text);$('heroStatus').textContent='LIVE • Playlist connected';render();toast('Live playlist loaded: '+channels.length+' channels');}catch(e){console.error(e);$('heroStatus').textContent='Unable to load live playlist';$('liveCount').textContent='Playlist unavailable';toast('Could not load the M3U playlist. Check hosting/CORS.')}}
function openPlayer(i){if(!channels[i])return;current=i;$('player').style.display='block';document.body.style.overflow='hidden';loadChannel(i);render()}
function closePlayer(){stopVideo();$('player').style.display='none';document.body.style.overflow='';}
function stopVideo(){if(hls){hls.destroy();hls=null}const v=$('video');v.pause();v.removeAttribute('src');v.load()}
function loadChannel(i){const c=channels[i];if(!c)return;current=i;$('now').textContent=c.name;$('playStatus').textContent='Connecting…';stopVideo();const v=$('video');v.volume=Number($('volume').value);if(v.canPlayType('application/vnd.apple.mpegurl')){v.src=c.url;v.play().then(()=>$('playStatus').textContent='LIVE').catch(()=>$('playStatus').textContent='Press play');}else if(window.Hls&&Hls.isSupported()){hls=new Hls({enableWorker:true});hls.loadSource(c.url);hls.attachMedia(v);hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().then(()=>$('playStatus').textContent='LIVE').catch(()=>$('playStatus').textContent='Press play')});hls.on(Hls.Events.ERROR,(e,d)=>{if(d.fatal)$('playStatus').textContent='Stream unavailable';});}else{$('playStatus').textContent='HLS not supported on this browser'};render()}
function nextChannel(){if(!channels.length)return;loadChannel((current+1)%channels.length)}function prevChannel(){if(!channels.length)return;loadChannel((current-1+channels.length)%channels.length)}function toggleMute(){const v=$('video');v.muted=!v.muted;$('muteBtn').textContent=v.muted?'🔇':'🔊'}
$('volume').addEventListener('input',e=>{$('video').volume=Number(e.target.value);if(Number(e.target.value)>0)$('video').muted=false});$('search').addEventListener('input',e=>{searchTerm=e.target.value;render();showPage('channels')});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePlayer();if(e.key==='ArrowRight'&&$('player').style.display==='block')nextChannel();if(e.key==='ArrowLeft'&&$('player').style.display==='block')prevChannel()});function playFeatured(){openPlayer(0)}function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',2600)}
loadPlaylist();
setInterval(()=>{document.querySelectorAll('.rail').forEach(r=>{if(r.scrollWidth>r.clientWidth)r.scrollBy({left:r.clientWidth*.75,behavior:'smooth'});if(r.scrollLeft+r.clientWidth>=r.scrollWidth-10)r.scrollTo({left:0,behavior:'smooth'})})},5000);
</script></body></html>
